[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php2shell-scanner"
version = "0.1.0"
description = "Non-invasive PHP2Shell version exposure scanner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "php2shell-scanner contributors"}]
dependencies = []

[project.scripts]
php2shell-scan = "php2shell_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


